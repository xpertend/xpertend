<header class="site-header">
  <div class="container">
    <nav class="navbar navbar-expand-lg py-3" aria-label="Main navigation">
      <a
        class="navbar-brand xpertend-brand"
        routerLink="/"
        aria-label="Xpertend Home"
        (click)="closeMenu()"
      >
        <span class="logo-mark logo-spark" aria-hidden="true">
          <span class="logo-x">X</span>
          <span class="spark">✦</span>
        </span>
      </a>

      <button
        class="navbar-toggler"
        type="button"
        aria-label="Toggle navigation"
        [attr.aria-expanded]="isMenuOpen"
        aria-controls="mainNavigation"
        (click)="toggleMenu()"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div
        id="mainNavigation"
        class="collapse navbar-collapse"
        [class.show]="isMenuOpen"
      >
        <div class="header-menu ms-auto">
          <a
            class="nav-link"
            routerLink="/"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            Home
          </a>

          <a
            class="nav-link"
            routerLink="/ca-xpertend"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            CA Xpertend
          </a>

          <a
            class="nav-link"
            routerLink="/astrology-xpertend"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Astrology Xpertend
          </a>

          <a
            class="nav-link"
            routerLink="/heavy-xpertend"
            routerLinkActive="active"
            (click)="closeMenu()"
          >
            Heavy Xpertend
          </a>

          <a
            class="call-button"
            href="tel:+917980260077"
            aria-label="Call Xpertend at +91 7980260077"
            (click)="closeMenu()"
          >
            <span class="phone-icon" aria-hidden="true">
              <i class="bi bi-telephone-fill"></i>
            </span>

            <span>+91 7980260077</span>
          </a>
        </div>
      </div>
    </nav>
  </div>
</header>
